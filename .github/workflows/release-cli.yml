name: Release Go CLI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cli/**'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
  push:
    tags:
      - 'wechat-article-v*'

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#wechat-article-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="dev-${GITHUB_SHA::7}"
          elif ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          archive="wechat-article_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$archive"
          binary="wechat-article"
          if [ "$GOOS" = 'windows' ]; then binary='wechat-article.exe'; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/wechat-article/wechat-article-exporter/cli/internal/app.Version=$version" -o "dist/$archive/$binary" ./cmd/wechat-article
          cp README.md "dist/$archive/README.md"
          if [ "$GOOS" = 'windows' ]; then
            (cd dist && zip -r "$archive.zip" "$archive")
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          fi
          rm -rf "dist/$archive"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/wechat-article-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
