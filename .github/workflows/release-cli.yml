name: Release Go CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'wechat-article-v*'

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        name: Resolve and validate version metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/wechat-article-v* ]]; then
            version="${GITHUB_REF_NAME#wechat-article-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must use exact SemVer: wechat-article-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            expected_heading="# wechat-article v${version}"
            actual_heading="$(head -n 1 RELEASE_NOTES.md)"
            if [ "$actual_heading" != "$expected_heading" ]; then
              echo "RELEASE_NOTES.md heading mismatch" >&2
              echo "expected: $expected_heading" >&2
              echo "actual:   $actual_heading" >&2
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  parity-and-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Parity validator tests
        run: GO111MODULE=off go test -count=1 ./test/parity

      - name: Mandatory parity gate
        run: go run ./test/parity/validate.go --gate

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_COMMIT: '914e7df21a07ef503a81201c76d2b11c789d3fca'
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/rhysd/actionlint.git "refs/tags/${ACTIONLINT_VERSION}" | cut -f1)" = "$ACTIONLINT_COMMIT"
          GOBIN="$RUNNER_TEMP/validation-tools" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Workflow syntax
        run: $RUNNER_TEMP/validation-tools/actionlint -config-file actionlint.yaml .github/workflows/*.yml

      - name: Verify retired production sources remain absent
        shell: bash
        run: |
          set -euo pipefail
          retired_paths=(
            package.json yarn.lock nuxt.config.ts wrangler.toml Dockerfile
            pages components composables server store mcp-server/src
          )
          for retired_path in "${retired_paths[@]}"; do
            if test -n "$(git ls-files "$retired_path" "$retired_path/**")"; then
              echo "retired production source remains tracked: $retired_path" >&2
              exit 1
            fi
          done
          test -s docs/archive/final-web-capable-release.md
          test -s docs/operations/cloud-retirement-report.md
          test "$(git rev-parse 'wechat-article-v2.0.0^{}')" = c43efc90f6cbfbeb15c0b2a4a6f9c2495f652474
          test "$(git rev-parse 'wechat-article-web-final-2026-07-22^{}')" = bda9f3bc3605c8c47e5b4f4cad20bf35c35844e4
          grep -Fq 'Worker lookup returned not found' docs/operations/cloud-retirement-report.md
          grep -Fq 'Pages project lookup returned not found' docs/operations/cloud-retirement-report.md
          grep -Fq 'no user article or Credential bytes were found' docs/operations/cloud-retirement-report.md

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install integrity-pinned OpenSpec validator
        env:
          OPENSPEC_VERSION: 1.3.1
          OPENSPEC_INTEGRITY: sha512-QnbJfq/lUNCRY+TTXo87fuIpGCCaOYt280tmbuI112B/1vF0feIneK0/qhoTZNslRDhwwg1YcYDX0suxq2h6tw==
        run: |
          set -euo pipefail
          package='@fission-ai/openspec'
          tarball="$(npm pack "${package}@${OPENSPEC_VERSION}" --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          test -n "$tarball"
          actual_integrity="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | openssl base64 -A)"
          test "sha512-${actual_integrity}" = "$OPENSPEC_INTEGRITY"
          npm install --global --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$tarball"

      - name: Strict OpenSpec validation
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          set -euo pipefail
          openspec validate replace-web-with-local-go-cli --strict
          openspec validate local-browser-workspace --strict
          openspec validate improve-local-browser-workspace-ux --strict

      - name: Clean-room receipt validator tests
        working-directory: cli
        run: go test -count=1 ./cmd/cleanroom

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -checks='SA*,S1*,QF*' ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install browser workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify browser workspace and checked-in Go assets
        run: |
          set -euo pipefail
          pnpm run check
          pnpm run test
          pnpm run build
          pnpm run verify:go-assets
          pnpm run check:release-size

      - name: Install pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Sanitized loopback browser E2E
        run: pnpm run e2e

      - name: Real Go loopback browser E2E
        run: pnpm run e2e:real

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Unit and integration tests
        run: go test -count=1 ./...

      - name: Native keyring integration receipt
        shell: bash
        env:
          WECHAT_ARTICLE_KEYRING_INTEGRATION: '1'
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/keyring-smoke-receipt.txt"
          go test -tags=integration -count=1 -v -run '^TestPlatformKeyringIntegration$' ./internal/secrets | tee "$receipt"
          grep -Eq 'KEYRING_SMOKE_(PASS|SKIP)' "$receipt"
          if grep -q 'KEYRING_SMOKE_SKIP' "$receipt"; then
            case "${{ runner.os }}" in
              Linux)
                grep -Fq 'reason=credential-service-unavailable' "$receipt"
                ;;
              *)
                echo 'Native credential service smoke skipped on a release-supported desktop runner.' >&2
                exit 1
                ;;
            esac
          fi

      - name: Race tests
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race ./...

      - name: Native pseudo-terminal workspace smoke
        if: runner.os != 'macOS' || runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(go test -count=1 -v -run '^TestCLIWorkspaceRealPTYNavigationResizeAndCleanExit$' ./internal/app 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$output" == *'--- SKIP: TestCLIWorkspaceRealPTYNavigationResizeAndCleanExit'* ]]; then
            echo 'The native PTY smoke was skipped; this runner does not provide release evidence.' >&2
            exit 1
          fi
          exit "$status"

      - name: LibreOffice DOCX open smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          go test -count=1 -run TestGeneratedDOCXOpensInLibreOfficeHeadless ./internal/exporter

  fixture-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Parser and renderer corpus
        run: >-
          go test -count=1
          -run 'TestRepresentativeSamples|TestSampleEngagementAndAudio|TestRepresentativeUnavailableSamples|TestSampleSemanticAndStructuralGoldenSuite|TestTrackedSamplesHaveGoldenOrReviewedExclusion'
          ./internal/processor

      - name: Sanitized protocol corpus
        run: go test -count=1 ./internal/corpus

      - name: Export fixture corpus
        run: >-
          go test -count=1
          -run 'TestFormatSpecificGoldenAndStructuralRegression|TestCuratedHTMLPDFVisualAndStructuralRegression'
          ./internal/exporter

  database-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Upgrade every supported schema baseline
        run: >-
          go test -count=1
          -run 'TestMigrationUpgradeFromEverySupportedBaseline|TestMigrationReplyCheckpointsIsOrderedAndIdempotent|TestMigrationFailureRollsBackVersionAndSchema|TestOpenRefusesNewerSchema'
          ./internal/library

      - name: Backup, restore, and integrity matrix
        run: >-
          go test -count=1
          -run 'TestBackup|TestVerifyBackup|TestRestore|TestIntegrity'
          ./internal/library

  build:
    needs: [release-metadata, parity-and-retirement, static, webui, test, fixture-corpus, database-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build host SBOM generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-tools"
          GOBIN="$RUNNER_TEMP/sbom-tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: Build all release archives and SBOMs
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          SBOM_TOOL: ${{ runner.temp }}/sbom-tools/cyclonedx-gomod
        shell: bash
        run: |
          set -euo pipefail
          module_path='github.com/wechat-article/wechat-article-exporter/cli'
          targets=(darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64)
          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="wechat-article_${RELEASE_VERSION}_${goos}_${goarch}"
            binary='wechat-article'
            if [ "$goos" = windows ]; then binary='wechat-article.exe'; fi
            mkdir -p "dist/$archive"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/wechat-article/wechat-article-exporter/cli/internal/app.Version=$RELEASE_VERSION" \
                -o "dist/$archive/$binary" ./cmd/wechat-article
            go version -m "dist/$archive/$binary" | tee "dist/$archive/build-info.txt"
            cp README.md "dist/$archive/README.md"
            cp ../LICENSE "dist/$archive/LICENSE"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              "$SBOM_TOOL" app -json -output "dist/${archive}/sbom.raw.cdx.json" -main cmd/wechat-article .
            purl="pkg:golang/${module_path}@${RELEASE_VERSION}?type=module&goos=${goos}&goarch=${goarch}#cmd/wechat-article"
            jq --arg version "$RELEASE_VERSION" --arg purl "$purl" '
              .metadata.component.version = $version |
              .metadata.component.purl = $purl |
              .metadata.component["bom-ref"] = $purl
            ' "dist/${archive}/sbom.raw.cdx.json" > "dist/${archive}.sbom.cdx.json"
            test "$(jq -r '.metadata.component.version' "dist/${archive}.sbom.cdx.json")" = "$RELEASE_VERSION"
            test "$(jq -r '.metadata.component.purl' "dist/${archive}.sbom.cdx.json")" = "$purl"
            jq -e --arg value "$goos" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOOS" and .value == $value)' "dist/${archive}.sbom.cdx.json" >/dev/null
            jq -e --arg value "$goarch" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOARCH" and .value == $value)' "dist/${archive}.sbom.cdx.json" >/dev/null
            jq -e '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:CGO_ENABLED" and .value == "0")' "dist/${archive}.sbom.cdx.json" >/dev/null
            if [ "$goos" = windows ]; then
              (cd dist && zip -X -r "$archive.zip" "$archive")
            else
              tar -C dist -czf "dist/$archive.tar.gz" "$archive"
            fi
            rm -rf "dist/$archive"
          done

      - name: Create candidate checksum manifest
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "wechat-article_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "wechat-article_${RELEASE_VERSION}_darwin_arm64.sbom.cdx.json"
            "wechat-article_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "wechat-article_${RELEASE_VERSION}_darwin_amd64.sbom.cdx.json"
            "wechat-article_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "wechat-article_${RELEASE_VERSION}_linux_arm64.sbom.cdx.json"
            "wechat-article_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "wechat-article_${RELEASE_VERSION}_linux_amd64.sbom.cdx.json"
            "wechat-article_${RELEASE_VERSION}_windows_amd64.zip"
            "wechat-article_${RELEASE_VERSION}_windows_amd64.sbom.cdx.json"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 10
          test "${actual[*]}" = "${wanted[*]}"
          printf '%s\n' "${wanted[@]}" | xargs sha256sum > checksums.txt
          sha256sum --check checksums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-darwin-arm64
          path: |
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_darwin_arm64.tar.gz
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_darwin_arm64.sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-darwin-amd64
          path: |
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_darwin_amd64.tar.gz
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_darwin_amd64.sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-linux-arm64
          path: |
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_linux_arm64.tar.gz
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_linux_arm64.sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-linux-amd64
          path: |
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_linux_amd64.tar.gz
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_linux_amd64.sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-windows-amd64
          path: |
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_windows_amd64.zip
            cli/dist/wechat-article_${{ needs.release-metadata.outputs.version }}_windows_amd64.sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-checksums
          path: cli/dist/checksums.txt
          if-no-files-found: error

  archive-metadata:
    needs: [release-metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: wechat-article-*
          merge-multiple: true

      - name: Verify every archive layout, target metadata, and SBOM
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          while read -r goos goarch archive_ext binary_name; do
            archive="artifacts/wechat-article_${RELEASE_VERSION}_${goos}_${goarch}.${archive_ext}"
            sbom="artifacts/wechat-article_${RELEASE_VERSION}_${goos}_${goarch}.sbom.cdx.json"
            test -f "$archive"
            test -f "$sbom"
            extract_root="extracted/${goos}-${goarch}"
            mkdir -p "$extract_root"
            if [ "$archive_ext" = zip ]; then
              unzip -q "$archive" -d "$extract_root"
            else
              tar -xzf "$archive" -C "$extract_root"
            fi
            binary="$(find "$extract_root" -type f -name "$binary_name" -print -quit)"
            test -n "$binary"
            test -f "$(dirname "$binary")/README.md"
            test -f "$(dirname "$binary")/LICENSE"
            build_info="$(dirname "$binary")/build-info.txt"
            test -f "$build_info"
            grep -Fq "GOOS=$goos" "$build_info"
            grep -Fq "GOARCH=$goarch" "$build_info"
            grep -Fq 'CGO_ENABLED=0' "$build_info"
            jq -e --arg version "$RELEASE_VERSION" '.metadata.component.version == $version' "$sbom" >/dev/null
            jq -e --arg value "$goos" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOOS" and .value == $value)' "$sbom" >/dev/null
            jq -e --arg value "$goarch" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOARCH" and .value == $value)' "$sbom" >/dev/null
          done <<'TARGETS'
          darwin arm64 tar.gz wechat-article
          darwin amd64 tar.gz wechat-article
          linux arm64 tar.gz wechat-article
          linux amd64 tar.gz wechat-article
          windows amd64 zip wechat-article.exe
          TARGETS

  smoke:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: windows-latest
            goos: windows
            goarch: amd64
            archive_ext: zip
            binary: wechat-article.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact

      - name: Extract native archive
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          archive="$(find artifact -maxdepth 1 -type f -name "*.${ARCHIVE_EXT}" -print -quit)"
          test -n "$archive"
          mkdir smoke
          if [ "$ARCHIVE_EXT" = 'zip' ]; then
            unzip -q "$archive" -d smoke
          else
            tar -xzf "$archive" -C smoke
          fi

      - name: Smoke native binary
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          WECHAT_ARTICLE_SECRET_BACKEND: memory
        run: |
          set -euo pipefail
          binary="$(find smoke -type f -name "$BINARY_NAME" -print -quit)"
          test -n "$binary"
          "$binary" --version
          smoke_root="$RUNNER_TEMP/wechat-article-smoke"
          mkdir -p "$smoke_root/config" "$smoke_root/data" "$smoke_root/cache" "$smoke_root/state"
          WECHAT_ARTICLE_CONFIG_ROOT="$smoke_root/config" \
          WECHAT_ARTICLE_DATA_ROOT="$smoke_root/data" \
          WECHAT_ARTICLE_CACHE_ROOT="$smoke_root/cache" \
          WECHAT_ARTICLE_STATE_ROOT="$smoke_root/state" \
          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_DATA_HOME="$smoke_root/data" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          XDG_STATE_HOME="$smoke_root/state" \
            "$binary" status --json > "$smoke_root/status.json" 2> "$smoke_root/status.stderr" || {
              status=$?
              sed -n '1,160p' "$smoke_root/status.stderr" >&2
              test -s "$smoke_root/status.json" && sed -n '1,160p' "$smoke_root/status.json" >&2
              exit "$status"
            }
          echo 'status command completed'
          jq -e '.success == true' "$smoke_root/status.json" >/dev/null
          echo 'status envelope verified'
          jq -e '.data.runtime.storage.databaseAvailable == true' "$smoke_root/status.json" >/dev/null
          echo 'database availability verified'
          jq -e '.data.runtime.storage.objectStoreReady == true' "$smoke_root/status.json" >/dev/null
          echo 'object store readiness verified'
          build_info="$(dirname "$binary")/build-info.txt"
          test -f "$build_info"
          grep -Fq "GOOS=$EXPECTED_GOOS" "$build_info"
          echo 'archive GOOS verified'
          grep -Fq "GOARCH=$EXPECTED_GOARCH" "$build_info"
          echo 'archive GOARCH verified'
          grep -Fq 'CGO_ENABLED=0' "$build_info"
          echo 'archive CGO policy verified'

  clean-room-fixture:
    needs: [release-metadata, build, database-compatibility]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: windows-latest
            goos: windows
            goarch: amd64
            archive_ext: zip
            binary: wechat-article.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-checksums
          path: checksums

      - name: Install native Chromium dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium

      - name: Extract and run candidate-binary clean room
        shell: bash
        working-directory: cli
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_NAME: ${{ matrix.binary }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          artifact_root="$GITHUB_WORKSPACE/artifact"
          archive="$(find "$artifact_root" -maxdepth 1 -type f -name "*.${ARCHIVE_EXT}" -print -quit)"
          sbom="$(find "$artifact_root" -maxdepth 1 -type f -name '*.sbom.cdx.json' -print -quit)"
          checksums="$GITHUB_WORKSPACE/checksums/checksums.txt"
          test -n "$archive"
          test -n "$sbom"
          test -f "$checksums"
          extracted="$RUNNER_TEMP/wechat-article-clean-room-extracted"
          mkdir -p "$extracted"
          if [ "$ARCHIVE_EXT" = 'zip' ]; then unzip -q "$archive" -d "$extracted"; else tar -xzf "$archive" -C "$extracted"; fi
          binary="$(find "$extracted" -type f -name "$BINARY_NAME" -print -quit)"
          build_info="$(find "$extracted" -type f -name build-info.txt -print -quit)"
          test -n "$binary"
          test -n "$build_info"
          receipt="$RUNNER_TEMP/clean-room-fixture-${EXPECTED_GOOS}-${EXPECTED_GOARCH}.json"
          go run ./cmd/cleanroom run \
            --archive "$archive" \
            --binary "$binary" \
            --build-info "$build_info" \
            --sbom "$sbom" \
            --checksums "$checksums" \
            --output "$receipt" \
            --commit "$GITHUB_SHA" \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY"
          go run ./cmd/cleanroom verify --receipt "$receipt"
          test "$(jq -r '.platform.goos' "$receipt")" = "$EXPECTED_GOOS"
          test "$(jq -r '.platform.goarch' "$receipt")" = "$EXPECTED_GOARCH"
          cp "$receipt" "$GITHUB_WORKSPACE/clean-room-fixture-${EXPECTED_GOOS}-${EXPECTED_GOARCH}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-room-fixture-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clean-room-fixture-${{ matrix.goos }}-${{ matrix.goarch }}.json
          if-no-files-found: error

  controlled-live-receipts:
    if: startsWith(github.ref, 'refs/tags/wechat-article-v')
    needs: [release-metadata, build, clean-room-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download authorized controlled-live receipt set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECEIPT_RUN_ID: ${{ vars.CONTROLLED_LIVE_RECEIPT_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controlled-live"
          if [ -z "$RECEIPT_RUN_ID" ]; then
            echo 'Set CONTROLLED_LIVE_RECEIPT_RUN_ID to the authorized native receipt collection run.' >&2
            exit 1
          fi
          if ! gh run download "$RECEIPT_RUN_ID" \
            --name controlled-live-release-receipts \
            --dir "$RUNNER_TEMP/controlled-live"; then
            echo 'Stable publication requires an explicitly authorized controlled-live-release-receipts artifact.' >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-checksums
          path: ${{ runner.temp }}/checksums

      - name: Verify five-target controlled-live gate
        working-directory: cli
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.release-metadata.outputs.version }}
          EXPECTED_TAG: ${{ github.ref_name }}
          RECEIPT_RUN_ID: ${{ vars.CONTROLLED_LIVE_RECEIPT_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROLLED_LIVE_WORKFLOW_ID: ${{ vars.CONTROLLED_LIVE_WORKFLOW_ID }}
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/controlled-live-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECEIPT_RUN_ID" > "$run_json"
          test "$(jq -r '.repository.full_name' "$run_json")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.head_sha' "$run_json")" = "$EXPECTED_COMMIT"
          test "$(jq -r '.status' "$run_json")" = 'completed'
          test "$(jq -r '.conclusion' "$run_json")" = 'success'
          test "$(jq -r '.event' "$run_json")" = 'workflow_dispatch'
          if ! [[ "$EXPECTED_CONTROLLED_LIVE_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Set CONTROLLED_LIVE_WORKFLOW_ID to the approved controlled-live workflow numeric ID.' >&2
            exit 1
          fi
          test "$(jq -r '.workflow_id' "$run_json")" = "$EXPECTED_CONTROLLED_LIVE_WORKFLOW_ID"
          mapfile -t receipt_sets < <(find "$RUNNER_TEMP/controlled-live" -type f -name 'release-receipt-set.json' -print | sort)
          test "${#receipt_sets[@]}" -eq 1
          receipt_set="${receipt_sets[0]}"
          test "$(jq -r '.release.repository' "$receipt_set")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.release.commit' "$receipt_set")" = "$EXPECTED_COMMIT"
          test "$(jq -r '.release.version' "$receipt_set")" = "$EXPECTED_VERSION"
          test "$(jq -r '.release.tag' "$receipt_set")" = "$EXPECTED_TAG"
          checksum_manifest="$RUNNER_TEMP/checksums/checksums.txt"
          test -f "$checksum_manifest"
          checksum_digest="$(sha256sum "$checksum_manifest" | cut -d ' ' -f1)"
          test "$(jq -r '.release.checksumManifestSha256' "$receipt_set")" = "$checksum_digest"
          go run ./cmd/cleanroom verify-set \
            --receipt-set "$receipt_set" \
            --repository "$EXPECTED_REPOSITORY" \
            --tag "$EXPECTED_TAG" \
            --commit "$EXPECTED_COMMIT" \
            --version "$EXPECTED_VERSION" \
            --checksum-manifest-sha256 "$checksum_digest"

  release:
    if: startsWith(github.ref, 'refs/tags/wechat-article-v')
    needs: [release-metadata, build, archive-metadata, smoke, clean-room-fixture, controlled-live-receipts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: wechat-article-*
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          test -f checksums.txt
          sha256sum --check checksums.txt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 11
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/source/RELEASE_NOTES.md" \
            --verify-tag
