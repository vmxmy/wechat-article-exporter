name: Release Go CLI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cli/**'
      - 'openspec/**'
      - 'test/fixtures/**'
      - 'test/parity/**'
      - 'RELEASE_NOTES.md'
      - 'docs/architecture/database-compatibility.md'
      - 'docs/architecture/sqlite-policy.md'
      - 'docs/archive/**'
      - 'docs/migration/**'
      - 'docs/operations/**'
      - 'docs/release/**'
      - 'samples/**'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
  push:
    tags:
      - 'wechat-article-v*'

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        name: Resolve and validate version metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/wechat-article-v* ]]; then
            version="${GITHUB_REF_NAME#wechat-article-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must use exact SemVer: wechat-article-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            expected_heading="# wechat-article v${version}"
            actual_heading="$(head -n 1 RELEASE_NOTES.md)"
            if [ "$actual_heading" != "$expected_heading" ]; then
              echo "RELEASE_NOTES.md heading mismatch" >&2
              echo "expected: $expected_heading" >&2
              echo "actual:   $actual_heading" >&2
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  parity-and-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Parity validator tests
        run: GO111MODULE=off go test -count=1 ./test/parity

      - name: Mandatory parity gate
        run: go run ./test/parity/validate.go --gate

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_COMMIT: '914e7df21a07ef503a81201c76d2b11c789d3fca'
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/rhysd/actionlint.git "refs/tags/${ACTIONLINT_VERSION}" | cut -f1)" = "$ACTIONLINT_COMMIT"
          GOBIN="$RUNNER_TEMP/validation-tools" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Workflow syntax
        run: $RUNNER_TEMP/validation-tools/actionlint .github/workflows/release-cli.yml

      - name: Verify retired production sources remain absent
        shell: bash
        run: |
          set -euo pipefail
          retired_paths=(
            package.json yarn.lock nuxt.config.ts wrangler.toml Dockerfile
            pages components composables server store mcp-server/src
          )
          for retired_path in "${retired_paths[@]}"; do
            if test -n "$(git ls-files "$retired_path" "$retired_path/**")"; then
              echo "retired production source remains tracked: $retired_path" >&2
              exit 1
            fi
          done
          test -s docs/archive/final-web-capable-release.md
          test -s docs/operations/cloud-retirement-report.md
          test "$(git rev-parse 'wechat-article-v2.0.0^{}')" = c43efc90f6cbfbeb15c0b2a4a6f9c2495f652474
          test "$(git rev-parse 'wechat-article-web-final-2026-07-22^{}')" = bda9f3bc3605c8c47e5b4f4cad20bf35c35844e4
          grep -Fq 'Worker lookup returned not found' docs/operations/cloud-retirement-report.md
          grep -Fq 'Pages project lookup returned not found' docs/operations/cloud-retirement-report.md
          grep -Fq 'no user article or Credential bytes were found' docs/operations/cloud-retirement-report.md

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install integrity-pinned OpenSpec validator
        env:
          OPENSPEC_VERSION: 1.3.1
          OPENSPEC_INTEGRITY: sha512-QnbJfq/lUNCRY+TTXo87fuIpGCCaOYt280tmbuI112B/1vF0feIneK0/qhoTZNslRDhwwg1YcYDX0suxq2h6tw==
        run: |
          set -euo pipefail
          package='@fission-ai/openspec'
          tarball="$(npm pack "${package}@${OPENSPEC_VERSION}" --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          test -n "$tarball"
          actual_integrity="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | openssl base64 -A)"
          test "sha512-${actual_integrity}" = "$OPENSPEC_INTEGRITY"
          npm install --global --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$tarball"

      - name: Strict OpenSpec validation
        env:
          OPENSPEC_TELEMETRY: '0'
        run: openspec validate replace-web-with-local-go-cli --strict

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -checks='SA*,S1*,QF*' ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Unit and integration tests
        run: go test ./...

      - name: Native keyring integration receipt
        shell: bash
        env:
          WECHAT_ARTICLE_KEYRING_INTEGRATION: '1'
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/keyring-smoke-receipt.txt"
          go test -tags=integration -count=1 -v -run '^TestPlatformKeyringIntegration$' ./internal/secrets | tee "$receipt"
          grep -Eq 'KEYRING_SMOKE_(PASS|SKIP)' "$receipt"
          if grep -q 'KEYRING_SMOKE_SKIP' "$receipt"; then
            case "${{ runner.os }}" in
              Linux)
                grep -Fq 'reason=credential-service-unavailable' "$receipt"
                ;;
              *)
                echo 'Native credential service smoke skipped on a release-supported desktop runner.' >&2
                exit 1
                ;;
            esac
          fi

      - name: Race tests
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: Native pseudo-terminal workspace smoke
        if: runner.os != 'macOS' || runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(go test -count=1 -v -run '^TestCLIWorkspaceRealPTYNavigationResizeAndCleanExit$' ./internal/app 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$output" == *'--- SKIP: TestCLIWorkspaceRealPTYNavigationResizeAndCleanExit'* ]]; then
            echo 'The native PTY smoke was skipped; this runner does not provide release evidence.' >&2
            exit 1
          fi
          exit "$status"

      - name: LibreOffice DOCX open smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          go test -count=1 -run TestGeneratedDOCXOpensInLibreOfficeHeadless ./internal/exporter

  fixture-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Parser and renderer corpus
        run: >-
          go test -count=1
          -run 'TestRepresentativeSamples|TestSampleEngagementAndAudio|TestRepresentativeUnavailableSamples|TestSampleSemanticAndStructuralGoldenSuite|TestTrackedSamplesHaveGoldenOrReviewedExclusion'
          ./internal/processor

      - name: Sanitized protocol corpus
        run: go test -count=1 ./internal/corpus

      - name: Export fixture corpus
        run: >-
          go test -count=1
          -run 'TestFormatSpecificGoldenAndStructuralRegression|TestCuratedHTMLPDFVisualAndStructuralRegression'
          ./internal/exporter

  database-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Upgrade every supported schema baseline
        run: >-
          go test -count=1
          -run 'TestMigrationUpgradeFromEverySupportedBaseline|TestMigrationReplyCheckpointsIsOrderedAndIdempotent|TestMigrationFailureRollsBackVersionAndSchema|TestOpenRefusesNewerSchema'
          ./internal/library

      - name: Backup, restore, and integrity matrix
        run: >-
          go test -count=1
          -run 'TestBackup|TestVerifyBackup|TestRestore|TestIntegrity'
          ./internal/library

  build:
    needs: [release-metadata, parity-and-retirement, static, test, fixture-corpus, database-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build host SBOM generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-tools"
          GOBIN="$RUNNER_TEMP/sbom-tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: Build archive
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          SBOM_TOOL: ${{ runner.temp }}/sbom-tools/cyclonedx-gomod
        run: |
          set -euo pipefail
          archive="wechat-article_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$archive"
          binary="wechat-article"
          if [ "$GOOS" = 'windows' ]; then binary='wechat-article.exe'; fi
          go build -trimpath -ldflags="-s -w -X github.com/wechat-article/wechat-article-exporter/cli/internal/app.Version=$RELEASE_VERSION" -o "dist/$archive/$binary" ./cmd/wechat-article
          go version -m "dist/$archive/$binary" | tee "dist/$archive/build-info.txt"
          cp README.md "dist/$archive/README.md"
          cp ../LICENSE "dist/$archive/LICENSE"
          "$SBOM_TOOL" app -json -output "dist/${archive}/sbom.raw.cdx.json" -main cmd/wechat-article .
          module_path='github.com/wechat-article/wechat-article-exporter/cli'
          purl="pkg:golang/${module_path}@${RELEASE_VERSION}?type=module&goos=${GOOS}&goarch=${GOARCH}#cmd/wechat-article"
          jq --arg version "$RELEASE_VERSION" --arg purl "$purl" '
            .metadata.component.version = $version |
            .metadata.component.purl = $purl |
            .metadata.component["bom-ref"] = $purl
          ' "dist/${archive}/sbom.raw.cdx.json" > "dist/${archive}.sbom.cdx.json"
          test "$(jq -r '.metadata.component.version' "dist/${archive}.sbom.cdx.json")" = "$RELEASE_VERSION"
          test "$(jq -r '.metadata.component.purl' "dist/${archive}.sbom.cdx.json")" = "$purl"
          jq -e --arg value "$GOOS" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOOS" and .value == $value)' "dist/${archive}.sbom.cdx.json" >/dev/null
          jq -e --arg value "$GOARCH" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOARCH" and .value == $value)' "dist/${archive}.sbom.cdx.json" >/dev/null
          jq -e '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:CGO_ENABLED" and .value == "0")' "dist/${archive}.sbom.cdx.json" >/dev/null
          if [ "$GOOS" = 'windows' ]; then
            (cd dist && zip -X -r "$archive.zip" "$archive")
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          fi
          rm -rf "dist/$archive"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/*
          if-no-files-found: error

  archive-metadata:
    needs: [release-metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary: wechat-article
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - goos: windows
            goarch: amd64
            archive_ext: zip
            binary: wechat-article.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact

      - name: Verify archive layout, target metadata, and SBOM
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_NAME: ${{ matrix.binary }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(find artifact -maxdepth 1 -type f -name "*.${ARCHIVE_EXT}" -print -quit)"
          sbom="$(find artifact -maxdepth 1 -type f -name '*.sbom.cdx.json' -print -quit)"
          test -n "$archive"
          test -n "$sbom"
          mkdir extracted
          if [ "$ARCHIVE_EXT" = 'zip' ]; then unzip -q "$archive" -d extracted; else tar -xzf "$archive" -C extracted; fi
          binary="$(find extracted -type f -name "$BINARY_NAME" -print -quit)"
          test -n "$binary"
          test -f "$(dirname "$binary")/README.md"
          test -f "$(dirname "$binary")/LICENSE"
          test -f "$(dirname "$binary")/build-info.txt"
          build_info="$(dirname "$binary")/build-info.txt"
          grep -Fq "GOOS=$EXPECTED_GOOS" "$build_info"
          grep -Fq "GOARCH=$EXPECTED_GOARCH" "$build_info"
          grep -Fq 'CGO_ENABLED=0' "$build_info"
          echo 'archive build metadata verified'
          jq -e --arg version "$RELEASE_VERSION" '.metadata.component.version == $version' "$sbom" >/dev/null
          jq -e --arg value "$EXPECTED_GOOS" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOOS" and .value == $value)' "$sbom" >/dev/null
          jq -e --arg value "$EXPECTED_GOARCH" '.metadata.component.properties[] | select(.name == "cdx:gomod:build:env:GOARCH" and .value == $value)' "$sbom" >/dev/null

  smoke:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary: wechat-article
          - os: windows-latest
            goos: windows
            goarch: amd64
            archive_ext: zip
            binary: wechat-article.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wechat-article-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact

      - name: Extract native archive
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          archive="$(find artifact -maxdepth 1 -type f -name "*.${ARCHIVE_EXT}" -print -quit)"
          test -n "$archive"
          mkdir smoke
          if [ "$ARCHIVE_EXT" = 'zip' ]; then
            unzip -q "$archive" -d smoke
          else
            tar -xzf "$archive" -C smoke
          fi

      - name: Smoke native binary
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          WECHAT_ARTICLE_SECRET_BACKEND: memory
        run: |
          set -euo pipefail
          binary="$(find smoke -type f -name "$BINARY_NAME" -print -quit)"
          test -n "$binary"
          "$binary" --version
          smoke_root="$RUNNER_TEMP/wechat-article-smoke"
          mkdir -p "$smoke_root/config" "$smoke_root/data" "$smoke_root/cache" "$smoke_root/state"
          WECHAT_ARTICLE_CONFIG_ROOT="$smoke_root/config" \
          WECHAT_ARTICLE_DATA_ROOT="$smoke_root/data" \
          WECHAT_ARTICLE_CACHE_ROOT="$smoke_root/cache" \
          WECHAT_ARTICLE_STATE_ROOT="$smoke_root/state" \
          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_DATA_HOME="$smoke_root/data" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          XDG_STATE_HOME="$smoke_root/state" \
            "$binary" status --json > "$smoke_root/status.json" 2> "$smoke_root/status.stderr" || {
              status=$?
              sed -n '1,160p' "$smoke_root/status.stderr" >&2
              test -s "$smoke_root/status.json" && sed -n '1,160p' "$smoke_root/status.json" >&2
              exit "$status"
            }
          echo 'status command completed'
          jq -e '.success == true' "$smoke_root/status.json" >/dev/null
          echo 'status envelope verified'
          jq -e '.data.runtime.storage.databaseAvailable == true' "$smoke_root/status.json" >/dev/null
          echo 'database availability verified'
          jq -e '.data.runtime.storage.objectStoreReady == true' "$smoke_root/status.json" >/dev/null
          echo 'object store readiness verified'
          build_info="$(dirname "$binary")/build-info.txt"
          test -f "$build_info"
          grep -Fq "GOOS=$EXPECTED_GOOS" "$build_info"
          echo 'archive GOOS verified'
          grep -Fq "GOARCH=$EXPECTED_GOARCH" "$build_info"
          echo 'archive GOARCH verified'
          grep -Fq 'CGO_ENABLED=0' "$build_info"
          echo 'archive CGO policy verified'

  release:
    if: startsWith(github.ref, 'refs/tags/wechat-article-v')
    needs: [release-metadata, build, archive-metadata, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%f\n' | sort | xargs sha256sum > checksums.txt
          sha256sum --check checksums.txt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 11
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/source/RELEASE_NOTES.md" \
            --verify-tag
