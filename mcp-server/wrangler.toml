name = "wechat-article-mcp"
main = "src/index.ts"
compatibility_date = "2026-01-28"
compatibility_flags = ["nodejs_compat"]

# 自定义正式域：workers.dev 在国内不稳，绑 ziikoo.app 子域（自动建 DNS + 证书）
routes = [{ pattern = "mptext.ziikoo.app", custom_domain = true }]

# OAuth 2.1 token/grant 存储 —— workers-oauth-provider 要求绑定名必须叫 OAUTH_KV
# 部署前：wrangler kv namespace create OAUTH_KV  → 把返回的 id 填到下面
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "d44eb3b7fd744963a18e46a934b72d93"

# agents 客户端的 await import("ai") 在服务端用不到，stub 掉避免打入 AI SDK
[alias]
"ai" = "./src/stubs/ai.ts"

[vars]
# exporter（CF Pages）基址：MCP 工具与登录都复用它已部署的 /api/*
EXPORTER_BASE_URL = "https://mp.ziikoo.app"
# Set only after the compatibility release announces a concrete retirement
# deadline. Before that date new OAuth authorization remains available.
# REMOTE_OAUTH_DISABLE_AFTER = "2027-01-31T00:00:00Z"
LOCAL_CLI_MIGRATION_URL = "https://github.com/wechat-article/wechat-article-exporter#local-cli"

[env.preview]
name = "wechat-article-mcp-preview"
workers_dev = true
routes = []

[[env.preview.kv_namespaces]]
binding = "OAUTH_KV"
id = "ce9220f85744491dad21c7bc9c8ec39a"

[env.preview.vars]
EXPORTER_BASE_URL = "https://mp.ziikoo.app"
LOCAL_CLI_MIGRATION_URL = "https://github.com/wechat-article/wechat-article-exporter#local-cli"
